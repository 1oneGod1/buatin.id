services:
  - type: web
    name: buatin-id
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/render-start.sh
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: PesanKustom.id
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: buatin-id-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: buatin-id-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: FIREBASE_ENABLED
        value: true
      - key: FIREBASE_PROJECT_ID
        value: buatin-id-34ac3
      - key: FIREBASE_STORAGE_BUCKET
        value: buatin-id-34ac3.firebasestorage.app
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false

databases:
  - name: buatin-id-db
    plan: free
    region: singapore
    databaseName: buatin
    user: buatin
